<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Peru · Mapa de possibilidades</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f4f6f8; --bg2:#ffffff; --card:#ffffff; --line:#e4e9ef;
  --tx:#1c2530; --muted:#5f7286; --accent:#cc781b;
  --nat:#22b56a; --cul:#e08a2e; --esp:#8f68e6; --gas:#f0604c; --cos:#1f9fc4; --ama:#1f9c6e;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}

/* ---------- topo enxuto ---------- */
.top{position:relative;z-index:600;padding:calc(14px + env(safe-area-inset-top)) 0 10px;
  background:linear-gradient(180deg,#e8f0f2,rgba(244,246,248,0))}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0}
.eyebrow{color:var(--accent);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
h1{margin:0;font-size:1.28rem;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:.85rem;
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;transition:.18s var(--ease);white-space:nowrap}
.back:hover{color:var(--tx);border-color:var(--accent)}

/* ---------- filtros ---------- */
.filters{display:flex;gap:7px;overflow-x:auto;padding:10px 18px 12px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch}
.filters::-webkit-scrollbar{display:none}
.f{flex:0 0 auto;border:1px solid var(--line);background:var(--bg2);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.82rem;font-weight:600;cursor:pointer;
  transition:.2s var(--ease);white-space:nowrap;font-family:inherit}
.f:hover{color:var(--tx)}
.f.on{color:#0d1117;background:var(--tone,var(--accent));border-color:transparent}

/* ---------- mapa grande ---------- */
.mapbox{position:relative;height:min(68vh,720px);min-height:400px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
#map{position:absolute;inset:0;background:var(--bg2)}
.mapnote{position:absolute;left:0;right:0;bottom:0;z-index:450;pointer-events:none;
  padding:22px 18px 10px;font-size:.76rem;color:var(--muted);
  background:linear-gradient(180deg,rgba(244,246,248,0),rgba(244,246,248,.92))}
.mapfail{display:flex;align-items:center;justify-content:center;height:100%;padding:26px;
  text-align:center;color:var(--muted);font-size:.92rem;line-height:1.6}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);
  border:2px solid #fff;box-shadow:0 2px 8px rgba(20,30,45,.3);
  transition:transform .2s var(--ease)}
.pin.big{width:32px;height:32px}
.pin.dim{opacity:.22}
.leaflet-marker-icon:hover .pin{transform:rotate(-45deg) scale(1.16)}
.leaflet-container{background:var(--bg2)}
.leaflet-control-attribution{background:rgba(255,255,255,.82)!important;color:#7c8b9c!important;font-size:.62rem!important}
.leaflet-control-attribution a{color:#5f7286!important}
.leaflet-bar a{background:var(--card)!important;color:var(--tx)!important;border-color:var(--line)!important}

/* ---------- carrossel ---------- */
.railhead{display:flex;align-items:baseline;gap:9px;padding:20px 18px 0;max-width:1180px;margin:0 auto}
.railhead h2{margin:0;font-size:1rem;font-weight:700}
.railhead span{color:var(--muted);font-size:.8rem}
.rail{display:flex;gap:11px;overflow-x:auto;padding:12px 18px 20px;scroll-snap-type:x mandatory;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:1180px;margin:0 auto}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:200px;scroll-snap-align:start;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;
  transition:transform .22s var(--ease),border-color .22s var(--ease),opacity .22s var(--ease);box-shadow:0 1px 3px rgba(20,30,45,.05)}
.card:hover{transform:translateY(-3px);border-color:var(--tone,var(--accent));box-shadow:0 6px 16px rgba(20,30,45,.09)}
.card.hide{display:none}
.card .tone{width:26px;height:3px;border-radius:2px;background:var(--tone);margin-bottom:9px}
.card h3{margin:0;font-size:.95rem;font-weight:700;line-height:1.25}
.card .meta{color:var(--muted);font-size:.76rem;margin-top:5px}
.card .opt{display:inline-block;margin-top:8px;font-size:.66rem;color:var(--muted);
  border:1px dashed var(--line);border-radius:999px;padding:2px 8px}

/* ---------- painel deslizante ---------- */
.scrim{position:fixed;inset:0;z-index:900;background:rgba(22,30,40,.42);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:950;left:0;right:0;bottom:0;max-height:88vh;
  background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  transform:translateY(101%);transition:transform .38s var(--ease);
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -18px 50px rgba(20,30,45,.16)}
.sheet.on{transform:translateY(0)}
.grab{flex:0 0 auto;padding:9px 0 4px;display:flex;justify-content:center}
.grab i{width:38px;height:4px;border-radius:99px;background:var(--line);display:block}
.sheetscroll{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.hero{position:relative;height:190px;background:var(--card);overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s var(--ease)}
.hero img.on{opacity:1}
.hero .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:2.6rem;color:#9aa8b6;background:linear-gradient(135deg,#eef1f5,#dfe5eb)}
.hero .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,17,23,0) 42%,rgba(12,17,23,.72))}
.hero .cap{position:absolute;left:18px;right:18px;bottom:12px}
.hero h2{margin:0;font-size:1.34rem;font-weight:700;letter-spacing:-.02em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero .sub{color:var(--accent);font-size:.8rem;font-weight:700;margin-top:3px}
.body{padding:14px 18px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:.72rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--card)}
.tag.k{color:#0d1117;border-color:transparent;font-weight:700}
.why{color:var(--tx);font-size:.94rem;line-height:1.62;margin:0 0 15px}
.blk{margin-bottom:15px}
.blk h4{margin:0 0 7px;font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
.blk ul{margin:0;padding-left:17px}
.blk li{font-size:.9rem;line-height:1.62;margin-bottom:4px}
.blk p{margin:0;font-size:.9rem;line-height:1.62;color:var(--tx)}
.wk{display:inline-block;margin-top:2px;font-size:.75rem;color:var(--muted)}
@media(min-width:760px){
  .sheet{left:auto;right:0;top:0;bottom:0;width:430px;max-height:none;border-radius:0;
    border-left:1px solid var(--line);border-top:none;transform:translateX(101%)}
  .sheet.on{transform:translateX(0)}
  .grab{display:none}
  .hero{height:225px}
  .card{width:215px}
}
/* rotas sugeridas */
.routesbar{border-bottom:1px solid var(--line);background:var(--bg2)}
.rbhead{font-size:.84rem;font-weight:700;padding:14px 0 0;display:flex;align-items:baseline;gap:8px;color:var(--tx)}
.rbhead span{color:var(--muted);font-weight:400;font-size:.74rem}
.rchips{display:flex;gap:8px;overflow-x:auto;padding:11px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.rchips::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:8px 13px;font-size:.84rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.18s var(--ease);text-align:left;line-height:1.15}
.rc small{display:block;color:var(--muted);font-weight:400;font-size:.7rem;margin-top:2px}
.rc:hover{border-color:#4b7bec}
.rc.on{background:#eaf1ff;border-color:#4b7bec;color:#254a8f}
.rc.on small{color:#5c7bb8}
.rdetail{font-size:.84rem;color:var(--muted);line-height:1.55}
.rdetail:empty{display:none}
.rdetail.show{padding:2px 0 14px}
.rdetail b{color:var(--tx)}
.rseq{color:var(--tx);font-weight:600;display:inline-block;margin-top:4px}
/* painel: contexto, passeios, dica */
.ctx{color:var(--muted);font-size:.9rem;line-height:1.62;margin:-4px 0 15px}
ul.pas{list-style:none;padding:0;margin:0}
ul.pas li{padding:9px 0;border-bottom:1px solid var(--line)}
ul.pas li:last-child{border-bottom:none;padding-bottom:0}
.pas .pt{display:block;color:var(--tx);font-weight:600;font-size:.9rem;line-height:1.4}
.pas .pm{display:block;color:var(--accent);font-size:.78rem;font-weight:600;margin-top:2px}
.dica{background:#fdf6ea;border:1px solid #efdcbb;color:#7a5620;border-radius:12px;padding:11px 13px;font-size:.88rem;line-height:1.55;margin-bottom:15px}
/* minha rota */
.rc.mine{background:#fff5e9;border-color:#e8822e;color:#8a4e12}
.rc.mine.on{background:#e8822e;border-color:#e8822e;color:#fff}
.rc.mine.on small{color:#ffe4c9}
.addbtn{width:100%;margin:4px 0 16px;padding:12px;border-radius:12px;border:1.5px solid var(--accent);background:var(--accent);color:#fff;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer;transition:.15s var(--ease)}
.addbtn.added{background:#fff;color:var(--accent)}
.milist{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mi{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 11px;font-size:.8rem;color:var(--tx);font-weight:600}
.mi button{border:none;background:#e7ebf0;color:#7d8b9a;width:18px;height:18px;border-radius:50%;font-size:.68rem;cursor:pointer;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
.clr{border:none;background:none;color:var(--accent);font-weight:700;font-size:.78rem;cursor:pointer;font-family:inherit;text-decoration:underline;padding:0}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <div class="brand">
      <div class="eyebrow">🇵🇪 mapa de possibilidades</div>
      <h1>Onde ir no Peru</h1>
    </div>
    <a class="back" href="/">← Roteiro</a>
  </div>
</div>

<div class="filters" id="filters"></div>

<div class="mapbox">
  <div id="map"></div>
  <div class="mapnote" id="mapnote">Toque num pin para ver fotos e detalhes</div>
</div>

<div class="routesbar"><div class="wrap">
  <div class="rbhead">🧭 Rotas sugeridas <span>toque pra desenhar no mapa</span></div>
  <div class="rchips" id="rchips"></div>
  <div class="rdetail" id="rdetail"></div>
</div></div>

<div class="railhead"><h2 id="railtitle">Todos os lugares</h2><span id="railcount"></span></div>
<div class="rail" id="rail"></div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-hidden="true">
  <div class="grab"><i></i></div>
  <div class="sheetscroll">
    <div class="hero" id="hero"></div>
    <div class="body" id="sbody"></div>
  </div>
</aside>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ---------------- temas ---------------- */
const T={
  nat:{l:"Natureza",e:"🌿",c:"#3ecf7f"},
  cul:{l:"Cultura",e:"🏛️",c:"#f0a95c"},
  esp:{l:"Sagrado",e:"🙏",c:"#b18cf5"},
  gas:{l:"Comer",e:"🍽️",c:"#ff7a68"},
  cos:{l:"Costa",e:"🏖️",c:"#41c2e0"},
  ama:{l:"Selva",e:"🌳",c:"#2fae7a"}
};

/* ---------------- lugares ----------------
   wiki = títulos tentados em pt → es → en (foto + resumo) */
const P=[
 {n:"Lima",c:[-12.046,-77.043],t:"gas",d:"2–4 dias",work:1,opt:0,
  wiki:["Lima","Lima","Lima"],
  why:"Capital gastronômica do mundo e sua base agora. Falésias sobre o Pacífico, boêmia em Barranco e o melhor ceviche da vida. É daqui que você volta pro Brasil.",
  see:["Malecón de Miraflores no pôr do sol","Barranco: murais e a Puente de los Suspiros","Huaca Pucllana — pirâmide pré-inca no meio da cidade","Circuito Mágico del Agua à noite"],
  eat:["<b>Central</b> e <b>Maido</b> — topo do ranking mundial (reserve com meses)","La Mar — cebicheria do Gastón","Mercado de Surquillo: cebiche barato e ótimo","Anticuchos de rua em Barranco"],
  go:"Você está aqui. Ponto de partida e de retorno."},

 {n:"Paracas · Islas Ballestas",c:[-13.83,-76.25],t:"nat",d:"1–2 dias",work:0,opt:0,
  wiki:["Ilhas Ballestas","Islas Ballestas","Ballestas Islands"],
  why:"As ‘Galápagos dos pobres’: passeio de barco entre lobos-marinhos, pinguins de Humboldt e paredões cobertos de aves. Em terra, a reserva junta deserto vermelho e oceano.",
  see:["Passeio de barco às Ballestas (saída ~8h)","O Candelabro — geoglifo gigante na encosta","Reserva de Paracas: Playa Roja e falésias","Pôr do sol na baía"],
  eat:["Peixe e frutos do mar no malecón","Conchas a la parmesana"],
  go:"De Lima: ônibus (Cruz del Sur / Peru Hop) ~4h pela Panamericana."},

 {n:"Huacachina",c:[-14.087,-75.763],t:"nat",d:"1 dia",work:0,opt:0,
  wiki:["Huacachina","Huacachina","Huacachina"],
  why:"Um oásis de verdade — palmeiras e uma lagoa cercada por dunas gigantes, no meio do deserto. Buggy e sandboard na hora dourada é o programa.",
  see:["Buggy + sandboard no fim da tarde","Subir a duna pro pôr do sol","Vinícolas e destilarias de pisco em Ica"],
  eat:["Barzinhos do oásis","Pisco sour na origem"],
  go:"~1h de Paracas até Ica; do centro de Ica, táxi ~10min. Ônibus sai de Ica, não do oásis."},

 {n:"Linhas de Nazca",c:[-14.739,-75.13],t:"cul",d:"1 dia",work:0,opt:1,
  wiki:["Linhas de Nazca","Líneas de Nazca","Nazca Lines"],
  why:"Geoglifos gigantes de 2 mil anos que só fazem sentido do alto: o beija-flor, o macaco, o astronauta. Sobrevoo de ~30min num teco-teco.",
  see:["Sobrevoo dos geoglifos (manhã, menos vento)","Mirador na Panamericana (barato)","Cemitério de Chauchilla","Aquedutos de Cantalloc"],
  eat:["Almoços simples no centro de Nazca"],
  go:"~2h30 ao sul de Ica/Huacachina de ônibus. Enjoa fácil — vá leve no café da manhã."},

 {n:"Arequipa",c:[-16.409,-71.537],t:"cul",d:"2–3 dias",work:1,opt:0,
  wiki:["Arequipa","Arequipa","Arequipa"],
  why:"A ‘Cidade Branca’, erguida em sillar vulcânico e emoldurada por três vulcões. Primeiro degrau de altitude (2.335m), gastronomia própria e cafés ótimos pra trabalhar.",
  see:["<b>Monasterio de Santa Catalina</b> — uma cidade dentro da cidade","Múmia Juanita no Museo Santuarios Andinos","Plaza de Armas e o mirante de Yanahuara","Bairro San Lázaro ao entardecer"],
  eat:["Picanterías tradicionais (rocoto relleno, adobo)","Chupe de camarones","Queso helado no mercado San Camilo"],
  go:"De Lima: ônibus noturno ~15h (Cruz del Sur / Oltursa) ou voo ~1h30."},

 {n:"Cañón del Colca",c:[-15.61,-71.86],t:"nat",d:"2 dias",work:0,opt:0,
  wiki:["Cânion do Colca","Cañón del Colca","Colca Canyon"],
  why:"Duas vezes mais fundo que o Grand Canyon. Ao amanhecer, os condores andinos sobem nas térmicas quase ao alcance da mão — um dos momentos mais bonitos do Peru.",
  see:["<b>Cruz del Cóndor</b> ao amanhecer","Trek de 2 dias até o oásis de Sangalle","Termas de La Calera em Chivay","Vilarejos de Yanque e Maca"],
  eat:["Truta andina","Chicharrón de alpaca"],
  go:"De Arequipa: ~4h. Tours de 1 ou 2 dias saem de lá; sobe a 3.400m no caminho."},

 {n:"Cusco",c:[-13.53,-71.97],t:"cul",d:"3–5 dias",work:1,opt:0,
  wiki:["Cusco","Cusco","Cusco"],
  why:"O umbigo do mundo inca — muros ciclópicos que sustentam igrejas coloniais. Coração cultural e espiritual da viagem, e a melhor base do país: tudo interessante está a um bate-volta.",
  see:["<b>Qorikancha</b> — o templo do sol sob o convento","Sacsayhuamán e suas pedras impossíveis","San Blas: ladeiras, ateliês e mirantes","Mercado de San Pedro"],
  eat:["Lomo saltado e cuy pros corajosos","Green Point (vegano, San Blas)","Chicharrón no San Pedro","Cafés de especialidade pra trabalhar"],
  go:"De Arequipa: ônibus noturno ~10h. De Puno: Inka Express ~7h com paradas. Suba devagar: 3.400m."},

 {n:"Valle Sagrado",c:[-13.32,-72.08],t:"esp",d:"2–3 dias",work:0,opt:0,
  wiki:["Vale Sagrado dos Incas","Valle Sagrado de los Incas","Sacred Valley"],
  why:"O vale do Urubamba, mais baixo e ameno que Cusco — muita gente aclimata aqui. Ruínas, mercados e as salinas escalonadas: paisagem que parece desenhada.",
  see:["<b>Salineras de Maras</b> — milhares de poças de sal na encosta","<b>Moray</b> — círculos concêntricos incas","Pisac: ruínas no alto + mercado","Ollantaytambo — vila inca viva e porta do trem"],
  eat:["Truta do rio","Chicha morada","Mercados de Pisac e Urubamba"],
  go:"De Cusco: colectivos frequentes ~1h. Vale dormir por lá pra render mais."},

 {n:"Machu Picchu",c:[-13.163,-72.545],t:"esp",d:"1–2 dias",work:0,opt:0,
  wiki:["Machu Picchu","Machu Picchu","Machu Picchu"],
  why:"O imperdível. A cidadela suspensa entre picos e neblina que resume a viagem inteira. Chegar ao amanhecer, antes dos ônibus, é outro nível.",
  see:["A cidadela e o cartão-postal do Huayna Picchu","Subir o <b>Huayna Picchu</b> ou a Montaña (ingresso à parte)","Templo do Sol e Intihuatana","Puente Inca"],
  eat:["Leve água e lanche — dentro não se come","Aguas Calientes tem o básico"],
  go:"⚠️ Ingresso por circuito, cotas esgotam — compre em tuboleto.cultura.pe com antecedência. De Ollantaytambo: trem ~1h30 + ônibus. Ou trek Salkantay 4–5 dias."},

 {n:"Laguna Humantay",c:[-13.34,-72.55],t:"nat",d:"1 dia",work:0,opt:0,
  wiki:["Laguna Humantay","Laguna Humantay","Humantay Lake"],
  why:"Uma lagoa turquesa impossível a 4.200m, com a geleira do Salkantay caindo dentro dela. Subida curta e puxada, recompensa desproporcional.",
  see:["A caminhada final até a lagoa (~1h30)","Oferendas de pedra dos peregrinos","O nevado Salkantay ao fundo"],
  eat:["Café da manhã e almoço saem no tour"],
  go:"Bate-volta de Cusco: saída ~4h da manhã, volta à noite. Aclimatize antes."},

 {n:"Montaña 7 Colores",c:[-13.87,-71.30],t:"nat",d:"1 dia",work:0,opt:0,
  wiki:["Vinicunca","Vinicunca","Rainbow Mountain"],
  why:"Faixas minerais que pintam a montanha de vermelho, ocre e turquesa, a 5.000m. Alternativa mais calma e menos íngreme: Palccoyo.",
  see:["O mirante principal de Vinicunca","<b>Valle Rojo</b> ao lado (vale o extra)","Palccoyo — versão tranquila, 3 montanhas coloridas","Rebanhos de alpacas no caminho"],
  eat:["Incluído no tour; leve coca e água"],
  go:"Bate-volta de Cusco, dia inteiro. 5.000m: só depois de bem aclimatado."},

 {n:"Puno · Lago Titicaca",c:[-15.84,-70.02],t:"esp",d:"2–3 dias",work:0,opt:0,
  wiki:["Puno","Lago Titicaca","Lake Titicaca"],
  why:"O lago navegável mais alto do mundo (3.800m) e, no mito, o berço do primeiro inca. Ilhas de junco que flutuam de verdade e comunidades que vivem nelas.",
  see:["<b>Ilhas flutuantes dos Uros</b> — feitas de totora","Taquile: têxteis Patrimônio da Humanidade","Amantaní com homestay (dormir na ilha)","Chullpas de Sillustani ao pôr do sol"],
  eat:["Trucha do lago","Quinoa em tudo","Mercado central de Puno"],
  go:"De Cusco: Inka Express ~7h (com paradas) ou direto. Daqui saem ônibus pra Bolívia."},

 {n:"Huaraz · Cordillera Blanca",c:[-9.53,-77.53],t:"nat",d:"3–5 dias",work:0,opt:1,
  wiki:["Huaraz","Huaraz","Huaraz"],
  why:"O paraíso do trekking andino: picos nevados de 6.000m e lagoas de um azul irreal. Se natureza é o que te move, é o lugar mais espetacular do país — mas fica ao norte de Lima.",

/* ---------------- conteúdo enriquecido (contexto, passeios, rotas) ---------------- */
const EX = {"Lima": {"context": "Fundada pelos espanhóis em 1535 como 'Cidade dos Reis', a capital peruana mistura palácios coloniais do Centro Histórico (Patrimônio da UNESCO) com a modernidade à beira-mar de Miraflores e a boemia artística de Barranco. É hoje a capital gastronômica da América do Sul, berço do ceviche e do pisco sour, com restaurantes entre os melhores do mundo. O céu costuma ficar cinza (a famosa 'garúa') boa parte do ano, mas a vibe cosmopolita, o mar e a comida compensam.", "passeios": [{"titulo": "City tour pelo Centro Histórico + Catacumbas do Convento de San Francisco", "duracao": "~4h", "preco": "S/ 60-110 (entrada San Francisco ~S/ 20-30)"}, {"titulo": "Tour gastronômico a pé por Barranco (ceviche, causa, pisco sour, chocolate)", "duracao": "~3-4h", "preco": "US$ 50-90"}, {"titulo": "Museo Larco (arte pré-colombiana e cerâmica erótica) + café no jardim", "duracao": "~2-3h", "preco": "entrada S/ 35 (~US$ 10)"}, {"titulo": "Visita guiada à Huaca Pucllana (pirâmide de adobe no meio de Miraflores)", "duracao": "~1h30", "preco": "S/ 15 dia / S/ 17 à noite"}, {"titulo": "Circuito Mágico del Agua à noite (show de fontes com luz e música)", "duracao": "~1h30-2h", "preco": "S/ 4-5 (~US$ 1)"}, {"titulo": "Aula de culinária: aprender a fazer ceviche e pisco sour em Miraflores", "duracao": "~3h", "preco": "US$ 40-70"}, {"titulo": "Parapente sobre a Costa Verde de Miraflens (voo duplo à beira do penhasco)", "duracao": "~10-15 min", "preco": "US$ 60-90"}], "dica": "De maio a novembro o céu vive cinza e úmido (garúa) — não estranhe. Se quiser jantar nos templos da gastronomia (Central, Maido, Kjolle), reserve com semanas de antecedência; os balcões de degustação enchem rápido."}, "Paracas · Islas Ballestas": {"context": "Paracas é uma pacata vila de pescadores no litoral desértico de Ica, cercada pela primeira reserva marinha do Peru, onde o deserto encontra o Pacífico. As Islas Ballestas, apelidadas de 'Galápagos dos pobres', abrigam colônias barulhentas de leões-marinhos, pinguins de Humboldt e milhares de aves marinhas. No caminho de barco aparece 'El Candelabro', um enorme geoglifo cravado na encosta cuja origem ainda é um mistério.", "passeios": [{"titulo": "Passeio de lancha às Islas Ballestas (leões-marinhos, pinguins, El Candelabro)", "duracao": "~2h", "preco": "S/ 50-60 + taxa de embarque ~S/ 18"}, {"titulo": "Tour pela Reserva Nacional de Paracas (Playa Roja, La Catedral, mirantes)", "duracao": "~3-4h", "preco": "S/ 35-60 + entrada da reserva ~S/ 11"}, {"titulo": "Passeio de caiaque ou stand-up paddle na baía calma de Paracas", "duracao": "~1-2h", "preco": "S/ 40-80"}, {"titulo": "Jantar de frutos do mar frescos no calçadão de El Chaco ao pôr do sol", "duracao": "~1-2h", "preco": "S/ 40-80 por pessoa"}, {"titulo": "Sobrevoo das Linhas de Nazca partindo de Pisco/Paracas (mais curto que de Nazca)", "duracao": "~1h30 total", "preco": "US$ 90-130"}, {"titulo": "Tour de quadriciclo ou bike pelas trilhas desérticas da reserva", "duracao": "~2-3h", "preco": "S/ 60-120"}], "dica": "Pegue o primeiro barco do dia (por volta das 8h): o mar está mais calmo, há menos vento e a luz é melhor para fotos. Não há sombra na lancha — leve chapéu, protetor solar e um casaco corta-vento."}, "Huacachina": {"context": "Huacachina é um minúsculo oásis natural em torno de uma lagoa verde, cercado por dunas gigantes de areia dourada, a poucos minutos de Ica. Segundo a lenda, a lagoa nasceu das lágrimas de uma princesa e suas águas teriam poder curativo. Hoje é a meca peruana do sandboard e dos passeios de buggy, com uma vibe descontraída de mochileiro e pores do sol espetaculares do alto das dunas.", "passeios": [{"titulo": "Passeio de buggy nas dunas + sandboard ao pôr do sol", "duracao": "~2h", "preco": "S/ 40-70 (US$ 15-25) + taxa de areia ~S/ 4-8"}, {"titulo": "Subir a duna grande a pé para assistir ao pôr do sol sobre o oásis", "duracao": "~1h", "preco": "grátis"}, {"titulo": "Pedalinho ou volta a pé ao redor da lagoa do oásis", "duracao": "~30-60 min", "preco": "grátis / pedalinho ~S/ 10-20"}, {"titulo": "Tour de vinícola e destilaria de pisco em Ica (com degustação)", "duracao": "~2-3h", "preco": "S/ 30-70"}, {"titulo": "Sandboard avulso com prancha profissional (em pé, estilo snowboard)", "duracao": "~1-2h", "preco": "US$ 15-30 extra sobre o buggy"}, {"titulo": "Observação de estrelas no deserto de Ica, longe da poluição luminosa", "duracao": "~1-2h", "preco": "S/ 30-60"}], "dica": "Escolha o buggy da última saída (por volta das 16h30-17h) para juntar sandboard e pôr do sol num só passeio. O buggy é radical (sobe e desce dunas em alta velocidade) — guarde o celular e segure firme."}, "Linhas de Nazca": {"context": "As Linhas de Nazca são centenas de geoglifos gigantes traçados no deserto entre ~500 a.C. e 500 d.C. pela cultura Nazca — figuras como o beija-flor, o macaco, a aranha, o condor e o enigmático 'astronauta', além de linhas retas que se estendem por quilômetros. Só fazem sentido pleno vistas do alto, o que alimenta teorias que vão de calendários astronômicos a rituais de água. São Patrimônio Mundial da UNESCO e foram estudadas por décadas pela pesquisadora alemã Maria Reiche.", "passeios": [{"titulo": "Sobrevoo de avioneta sobre as principais figuras (partindo do aeródromo de Nazca)", "duracao": "~30-35 min", "preco": "S/ 180-240 (US$ 90-120) + taxa de aeroporto"}, {"titulo": "Torre Mirador na Panamericana (vê o 'mãos/lagarto/árvore' de perto)", "duracao": "~30 min", "preco": "~S/ 5"}, {"titulo": "Cemitério de Chauchilla (múmias e tumbas Nazca a céu aberto no deserto)", "duracao": "~meio dia", "preco": "US$ 20-49"}, {"titulo": "Aquedutos de Cantalloc (engenharia hidráulica em espiral pré-colombiana)", "duracao": "~2-3h", "preco": "US$ 15-45"}, {"titulo": "Museu Maria Reiche ou Museu Antonini (contexto da cultura Nazca)", "duracao": "~1-2h", "preco": "S/ 15-20"}, {"titulo": "Tour em observatório astronômico de Nazca à noite (telescópio + céu do deserto)", "duracao": "~1h", "preco": "S/ 30-40"}], "dica": "Voe de manhã cedo (entre 8h e 10h), quando o vento é mais fraco e o voo tem menos turbulência. As avionetas fazem curvas fechadas para os dois lados verem cada figura — se você enjoa fácil, tome antináusea antes e evite comer muito no café da manhã."}, "Arequipa": {"context": "Apelidada de \"Cidade Branca\" pelas construções em sillar (pedra vulcânica branca extraída dos vulcões vizinhos), Arequipa tem um centro histórico colonial declarado Patrimônio da Humanidade pela UNESCO, emoldurado por três vulcões: Misti, Chachani e Pichu Pichu. É uma cidade de forte identidade própria, orgulhosa da sua gastronomia (considerada uma das melhores do Peru) e de um clima ensolarado quase o ano todo. A vibe mistura elegância colonial, vida de praça movimentada e uma cena de picanterías tradicionais que é atração por si só.", "passeios": [{"titulo": "City tour + Mosteiro de Santa Catalina (cidadela de freiras do séc. XVI, com ruas e pátios pintados de azul e ocre)", "duracao": "~4h", "preco": "tour S/ 30-60 + ingresso do mosteiro S/ 45"}, {"titulo": "Museo Santuarios Andinos para ver a múmia Juanita, a \"Dama de Gelo\" inca sacrificada nos Andes há ~500 anos", "duracao": "~1h30", "preco": "S/ 25-35 (com gorjeta do guia)"}, {"titulo": "Experiência gastronômica em picantería tradicional: rocoto relleno, chupe de camarones e adobo arequipenho", "duracao": "~2h", "preco": "S/ 40-70 por pessoa"}, {"titulo": "Ruta del Sillar: visita às pedreiras de sillar e petroglifos de Culebrillas, entendendo a pedra que ergueu a cidade", "duracao": "meio dia (~4h)", "preco": "S/ 60-90"}, {"titulo": "Rafting no Rio Chili, a poucos minutos do centro, com corredeiras classe II-IV", "duracao": "~3h", "preco": "US$ 30-45 (aprox. S/ 45-90 por trecho)"}, {"titulo": "Fim de tarde no mirante de Yanahuara e no bairro colonial, com arcos de sillar emoldurando o vulcão Misti", "duracao": "~1h30", "preco": "grátis (bairro público)"}], "dica": "Reserve pelo menos 2 noites em Arequipa antes de subir ao Colca: os ~2.335 m de altitude servem de aclimatação suave e ajudam muito a evitar o soroche (mal de altitude) no cânion, que passa dos 3.600 m em Chivay."}, "Cañón del Colca": {"context": "Um dos cânions mais profundos do mundo (mais de 3.000 m em alguns trechos, cerca do dobro do Grand Canyon), o Colca fica a cerca de 4-5h de Arequipa e combina paisagem dramática com aldeias andinas de igrejas coloniais e terraços agrícolas pré-incas ainda em uso. É o melhor lugar do Peru para ver de perto o voo do condor-dos-andes planando nas correntes térmicas. A região preserva vivas as tradições collagua e cabana, visíveis nos trajes bordados e nas festas locais.", "passeios": [{"titulo": "Cruz del Cóndor ao amanhecer: mirante onde os condores sobem das profundezas do cânion em pleno voo", "duracao": "~1h no mirante", "preco": "incluso nos tours + boleto turístico S/ 70 (estrangeiros)"}, {"titulo": "Tour clássico 2 dias / 1 noite saindo de Arequipa, com Chivay, aldeias de Yanque e Maca e a Cruz del Cóndor", "duracao": "2 dias", "preco": "US$ 55-90 (aprox. S/ 200-330) + entradas"}, {"titulo": "Trekking clássico até o oásis de Sangalle: descida de Cabanaconde ao fundo do cânion e pernoite entre palmeiras e piscinas naturais", "duracao": "2 dias", "preco": "a partir de S/ 60-230 conforme a agência + entradas"}, {"titulo": "Trek de 3 dias por Llahuar/San Juan de Chuccho e Sangalle, versão mais tranquila e imersiva do cânion", "duracao": "3 dias", "preco": "a partir de S/ 60 por pessoa (grupos) + entradas e refeições"}, {"titulo": "Banho nas termas de La Calera, perto de Chivay, com águas quentes vulcânicas ao pé das montanhas", "duracao": "~1h30", "preco": "S/ 15-20"}, {"titulo": "Parada no mirante de Patapampa (~4.900 m) para ver os vulcões e os apachetas (torres de pedra dos viajantes)", "duracao": "~30 min", "preco": "incluso na maioria dos tours"}], "dica": "Se for fazer o trek, leve pouca bagagem (deixe o resto no hostel em Arequipa ou Cabanaconde) e comece a descida bem cedo: a subida final do oásis até Cabanaconde é íngreme e pesada, e todo mundo prefere fazê-la antes do sol forte, saindo do fundo do cânion por volta das 5h da manhã."}, "Cusco": {"context": "Antiga capital do Império Inca e hoje coração da rota andina, Cusco foi construída pelos incas em formato de puma e depois recoberta por igrejas e casarões coloniais espanhóis sobre as muralhas de pedra originais, criando um casamento arquitetônico único a 3.400m de altitude. É a base natural para explorar Machu Picchu e o Vale Sagrado, mas a cidade tem alma própria: mercados fervilhantes, o bairro boêmio de San Blas subindo a ladeira, energia mística nas ruas e uma gastronomia andina em plena ascensão. A vibe mistura peregrinação espiritual, história viva e agito mochileiro, tudo com o pano de fundo das montanhas.", "passeios": [{"titulo": "City Tour meio período: Sacsayhuamán, Qenqo, Puka Pukara e Tambomachay", "duracao": "~5h (meio período)", "preco": "guia US$ 14-25 + boleto turístico parcial S/ 70 (ou integral S/ 130)"}, {"titulo": "Machu Picchu bate-e-volta de trem desde Cusco", "duracao": "dia inteiro (14-16h)", "preco": "pacote US$ 325+ | só entrada S/ 152 + S/ 11 taxa (Circuito 2)"}, {"titulo": "Montanha de 7 Cores (Vinicunca / Rainbow Mountain) com Vale Vermelho opcional", "duracao": "dia inteiro (~13h, madrugada)", "preco": "S/ 85-260 (US$ 23-69) + entrada ~S/ 25"}, {"titulo": "Laguna Humantay full day (trekking em lagoa turquesa a 4.200m)", "duracao": "dia inteiro (~13h)", "preco": "US$ 23-45 grupo | privativo pequeno até US$ 110 + entrada ~S/ 20"}, {"titulo": "Trilha Salkantay 4-5 dias até Machu Picchu (alternativa à Trilha Inca)", "duracao": "4 a 5 dias", "preco": "US$ 450-695 (inclui refeições, guia e entrada)"}, {"titulo": "Tour a pé por San Blas e degustação no Mercado San Pedro", "duracao": "~2-3h", "preco": "grátis (mercado) | tour guiado ~US$ 10-20 | almoço S/ 12-20"}], "dica": "Chegue e reserve 2-3 dias para aclimatar antes de qualquer trekking de altitude: suba devagar, beba mate de coca e evite álcool nas primeiras noites. O boleto turístico só se compra presencialmente (escritório COSITUC na Av. El Sol 103) e a entrada de Machu Picchu esgota com semanas de antecedência na alta temporada - compre em tuboleto.cultura.pe o quanto antes."}, "Valle Sagrado": {"context": "O Vale Sagrado dos Incas acompanha o rio Urubamba entre Cusco e Machu Picchu, num corredor fértil que os incas consideravam sagrado e transformaram em celeiro do império com engenharia agrícola espetacular. Aqui estão os terraços circulares de Moray (um laboratório agrícola com microclimas), as salinas milenares de Maras com milhares de poços brancos na encosta, a fortaleza-cidade viva de Ollantaytambo e o mercado colorido de Pisac. Com altitude mais baixa que Cusco, é o lugar ideal para aclimatar, e a vibe é de vilarejos andinos, tecelãs em teares tradicionais e paisagens de tirar o fôlego.", "passeios": [{"titulo": "Tour clássico Vale Sagrado: Pisac, Ollantaytambo e Chinchero", "duracao": "dia inteiro (~10h)", "preco": "US$ 25-45 grupo + boleto turístico parcial S/ 70"}, {"titulo": "Maras, Moray e Salineras (terraços circulares + salinas)", "duracao": "meio período (~5-6h)", "preco": "US$ 25-40 + Moray via boleto + Salineras S/ 10-20"}, {"titulo": "Oficina de tecelagem ancestral em Chinchero (Awana Wasi)", "duracao": "~1-2h", "preco": "demonstração grátis a ~S/ 20-50 (compra de peças à parte)"}, {"titulo": "Mercado artesanal de Pisac + ruínas incas no alto da montanha", "duracao": "~3-4h", "preco": "mercado grátis | ruínas via boleto turístico S/ 70"}, {"titulo": "Voo de balão ao amanhecer sobre Maras e o Vale (experiência menos óbvia)", "duracao": "~3-4h com traslado", "preco": "US$ 150-350 por pessoa"}, {"titulo": "Ollantaytambo a pé: fortaleza inca e vilarejo vivo pré-embarque a Machu Picchu", "duracao": "~2-3h", "preco": "entrada via boleto turístico S/ 70/130"}], "dica": "Durma uma ou duas noites em Ollantaytambo ou Urubamba em vez de ir e voltar de Cusco no mesmo dia: a altitude menor ajuda na aclimatação e você pega os sítios cedo, antes das multidões, além de já estar posicionado para o trem a Machu Picchu que sai de Ollantaytambo."}, "Machu Picchu": {"context": "Cidadela inca do século XV escondida a cerca de 2.430m entre picos cobertos de mata, foi revelada ao mundo pela expedição de Hiram Bingham em 1911 e batizada de 'a cidade perdida dos incas'. Hoje é Patrimônio Mundial da UNESCO e uma das sete maravilhas do mundo moderno, com terraços, templos e o relógio solar Intihuatana ainda de pé. A vibe é de reverência silenciosa ao amanhecer, quando a neblina se abre e a llama pasta entre as ruínas.", "passeios": [{"titulo": "Circuito 2 Clássico (a visita icônica com o mirador da foto de cartão-postal)", "duracao": "~2-3h no sítio", "preco": "ingresso estrangeiro S/ 200 (~US$ 55); cidadãos de Peru/Colômbia/Equador/Bolívia S/ 112"}, {"titulo": "Machu Picchu + Huayna Picchu (subida íngreme com escadas incas e vista aérea da cidadela — só 350 vagas/dia)", "duracao": "~4h total (subida ~1h)", "preco": "ingresso combinado ~S/ 200 (~US$ 55); esgota meses antes"}, {"titulo": "Machu Picchu + Montaña Machu Picchu (a montanha mais alta e menos disputada, panorâmica total do vale do Urubamba)", "duracao": "~4-5h total", "preco": "ingresso combinado ~S/ 200 (~US$ 55)"}, {"titulo": "Caminhada à Inti Punku / Puerta del Sol dentro do circuito (o portão por onde chega a Trilha Inca)", "duracao": "~1h só ida", "preco": "incluído no ingresso de circuito que autoriza o trecho"}, {"titulo": "Trem panorâmico Vistadome / 360° de Ollantaytambo + ônibus subindo de Aguas Calientes", "duracao": "dia inteiro de logística (trecho de trem ~1h40)", "preco": "trem US$ 140-180 ida/volta (opções desde ~US$ 92); ônibus da subida ~US$ 24 ida/volta"}, {"titulo": "Salkantay Trek 5 dias (alternativa de trekking à Trilha Inca, cruza passo a 4.600m e passa pela Laguna Humantay antes de chegar por Hidroelétrica)", "duracao": "5 dias / 4 noites", "preco": "desde US$ 519 por pessoa"}], "dica": "Compre o ingresso oficial com antecedência em tuboleto.cultura.pe — 3 a 4 meses antes se quiser a rota do Huayna Picchu (apenas 350 vagas/dia). Entre no primeiro turno da manhã para pegar menos gente e a neblina levantando."}, "Laguna Humantay": {"context": "Lagoa glacial de um turquesa quase irreal a 4.200m de altitude, no maciço do Salkantay (cordilheira de Vilcabamba), alimentada pelo degelo do nevado Humantay que se ergue logo atrás. É um lugar sagrado para os andinos, onde se montam apachetas (torres de pedra) e se deixam oferendas à Pachamama. A caminhada curta mas puxada pela altitude termina num anfiteatro de montanhas e geleira — um dos cenários mais fotografados do Peru.", "passeios": [{"titulo": "Tour compartilhado de dia inteiro desde Cusco (transporte, café, almoço e ingresso)", "duracao": "12-12,5h (saída ~4h30 da manhã)", "preco": "desde ~US$ 33-45 por pessoa"}, {"titulo": "Trekking até a lagoa (5km, +350m de desnível de Soraypampa a 3.850m até 4.200m)", "duracao": "~1h30-2h de subida", "preco": "incluído no tour"}, {"titulo": "Passeio a cavalo até perto do mirante (alívio para quem sente a altitude)", "duracao": "~1h", "preco": "extra local ~S/ 80-100 (~US$ 22-27)"}, {"titulo": "Tour privado sob medida (ritmo próprio, guia só para o grupo)", "duracao": "~12h", "preco": "US$ 144 por pessoa (grupos de 4) até US$ 429 (individual)"}, {"titulo": "Ritual de oferenda / apacheta à Pachamama na beira da lagoa (experiência menos óbvia, à parte do trekking)", "duracao": "~20-30min no local", "preco": "grátis / contribuição voluntária"}, {"titulo": "Salkantay Trek 5 dias, que acampa junto à Humantay no primeiro dia a caminho de Machu Picchu", "duracao": "5 dias / 4 noites", "preco": "desde US$ 519 por pessoa"}], "dica": "Aclimate-se 1 a 2 dias em Cusco antes de encarar os 4.200m — a subida é curta mas ofegante. Leve casaco corta-vento e água; o tour costuma sair de madrugada (~4h30) e fecha em fevereiro, reabrindo em março."}, "Montaña 7 Colores": {"context": "Também chamada de Vinicunca ou Rainbow Mountain, é uma cordilheira a 5.200m cujas faixas coloridas — vermelho, ocre, turquesa, dourado — vêm de camadas de minerais expostas pelo recuo das geleiras, tornando-se famosa só na última década. A National Geographic a incluiu entre os '100 lugares para ver antes de morrer'. A caminhada é curta, porém exigente pela altitude extrema, com paisagem de alpacas, picos nevados e o vizinho Valle Rojo pintado de vermelho.", "passeios": [{"titulo": "Tour clássico de dia inteiro a Vinicunca desde Cusco (transporte, guia e refeições)", "duracao": "dia inteiro (saída de madrugada)", "preco": "desde US$ 39-50 por pessoa (compartilhado); ~US$ 110 privado"}, {"titulo": "Caminhada de ~3km até o mirante da montanha colorida a 5.200m", "duracao": "~1h30-2h de subida", "preco": "incluído (ingresso local ~S/ 25)"}, {"titulo": "Extensão ao Valle Rojo (Valle Vermelho) ao lado, bem menos lotado", "duracao": "+1h a 1h30", "preco": "adicional ~S/ 20-30 (~US$ 6-8)"}, {"titulo": "Vinicunca + Red Valley de quadriciclo/ATV (pula boa parte da caminhada dura)", "duracao": "~13h no total (3h de ATV)", "preco": "US$ 70-130 por pessoa conforme grupo/privado"}, {"titulo": "Subida a cavalo até quase o topo (opção para quem sofre com a altitude)", "duracao": "~1h", "preco": "extra local ~S/ 80-120 (~US$ 22-33)"}, {"titulo": "Palccoyo, a 'montanha arco-íris alternativa' (4.900m, trilha de só 1km, quase sem multidão, com floresta de pedras e ponte inca de Checacupe)", "duracao": "dia inteiro", "preco": "US$ 30-50 por pessoa"}], "dica": "Aclimate-se em Cusco por alguns dias e mastigue folha de coca — os 5.200m derrubam quem chega direto. Se quiser fugir das multidões e da subida pesada, troque Vinicunca por Palccoyo, que tem visual parecido e trilha muito mais leve."}, "Puno · Lago Titicaca": {"context": "Puno é a capital folclórica do Peru, empoleirada a 3.812 m às margens do Titicaca, o lago navegável mais alto do mundo, com águas de um azul intenso que os incas consideravam berço do Sol. A cidade vibra com a fé andina e católica misturadas: em fevereiro a Fiesta de la Candelaria toma as ruas com milhares de dançarinos da Diablada em máscaras de demônio. O grande atrativo, porém, são as ilhas — as flutuantes de totora dos Uros, a tecelã Taquile (patrimônio da UNESCO) e a rural Amantaní, onde se dorme na casa de famílias quéchua sob um dos céus estrelados mais limpos do continente.", "passeios": [{"titulo": "Tour clássico 2 dias / 1 noite: Uros + Amantaní (homestay) + Taquile", "duracao": "2 dias", "preco": "S/ 150 a S/ 260"}, {"titulo": "Tour de 1 dia às ilhas Uros e Taquile (barco + almoço)", "duracao": "~7h (dia inteiro)", "preco": "US$ 25 a US$ 40 (S/ 90 a S/ 150)"}, {"titulo": "Kayak ao amanhecer entre as ilhas flutuantes dos Uros (menos óbvio, menos turístico)", "duracao": "~2-3h (5h-7h da manhã)", "preco": "US$ 25 (~S/ 90)"}, {"titulo": "Chullpas de Sillustani — torres funerárias pré-incas na Laguna Umayo", "duracao": "meio dia (sai 14h)", "preco": "US$ 15 a US$ 20 (S/ 55 a S/ 75)"}, {"titulo": "Bate-volta a Copacabana e Isla del Sol, na Bolívia (cruzando a fronteira)", "duracao": "dia inteiro", "preco": "US$ 30 (transporte) a US$ 100 (tour completo com guia e almoço)"}, {"titulo": "Fiesta de la Candelaria e desfile da Diablada (só em fevereiro)", "duracao": "vários dias", "preco": "grátis para assistir na rua"}], "dica": "A 3.800 m a soroche (mal de altitude) é real: chegue já aclimatado vindo de Cusco ou Arequipa, ande devagar no primeiro dia, hidrate-se e tome mate de coca. Reserve o homestay em Amantaní com antecedência e leve casaco, agasalho e lanterna — a noite na ilha é gelada e sem eletricidade constante."}, "Máncora": {"context": "Máncora é a praia mais famosa do norte peruano, na divisa entre Piura e Tumbes, conhecida por ter sol quase o ano inteiro e água morna — uma raridade no litoral frio do Pacífico peruano. Nasceu como vila de pescadores e virou point mochileiro e surfista, com uma das ondas de esquerda mais longas do país e uma vibe descontraída de reggae, cocktails ao pôr do sol e ceviche fresquíssimo. Entre julho e outubro as baleias jubarte passam pela costa para reproduzir, e nas caletas vizinhas dá para nadar entre tartarugas marinhas gigantes.", "passeios": [{"titulo": "Avistamento de baleias jubarte de lancha rápida (temporada jul-out, com hidrofone)", "duracao": "~3h (saída 5h30-6h)", "preco": "S/ 140 a S/ 200"}, {"titulo": "Nado com tartarugas marinhas no píer de El Ñuro (perto de Los Órganos)", "duracao": "meio dia", "preco": "S/ 60 a S/ 120 (ou S/ 5 só para ver do píer)"}, {"titulo": "Aula de surf na praia de Máncora (prancha e instrutor incluídos)", "duracao": "1 a 2h", "preco": "S/ 150 a S/ 170 (~US$ 25/h)"}, {"titulo": "Passeio pelos Manglares de Tumbes / Puerto Pizarro (aves, ilhas e viveiro de crocodilos)", "duracao": "dia inteiro", "preco": "S/ 50 a S/ 180 (tour) + entrada S/ 3,50"}, {"titulo": "Aula de kitesurf em Vichayito, o point de vento da região (menos óbvio)", "duracao": "~2h por aula", "preco": "~US$ 35 por aula (S/ 130)"}, {"titulo": "Banho na Poza de Barro — poço de lama e águas termais no interior de Máncora", "duracao": "meio dia", "preco": "S/ 30 a S/ 60 (com transporte)"}], "dica": "Para ver baleias, vá entre julho e outubro; para curtir sol forte e mar mais quente, dezembro a março. O sol equatorial é traiçoeiro mesmo nublado — use protetor alto e reaplique. Reserve o tour de baleias na véspera, pois saem de madrugada e lotam, e negocie o traslado a El Ñuro incluindo a espera do barco."}, "Huaraz · Cordillera Blanca": {"context": "Encravada a 3.050 m nos Andes centrais do Peru, Huaraz é a capital mundial do trekking tropical e a base para explorar a Cordillera Blanca, a cordilheira tropical mais alta do planeta, coroada pelo Huascarán (6.768 m). A cidade em si é pragmática e sem grande charme colonial (foi reconstruída após o terremoto de 1970), mas funciona como quartel-general de mochileiros e montanhistas: hostels, agências e locais de aluguel de equipamento em cada esquina. A recompensa está lá fora, nas lagunas de água turquesa glacial, geleiras e vales do Parque Nacional Huascarán.", "passeios": [{"titulo": "Laguna 69 (4.604 m) — a caminhada mais icônica da região", "duracao": "dia inteiro (saída ~4h30, retorno ~19h)", "preco": "tour S/ 60–100 + ingresso do parque S/ 30"}, {"titulo": "Trek Santa Cruz (4 dias) — travessia clássica pela Cordillera Blanca", "duracao": "4 dias / 3 noites", "preco": "US$ 310–380 (inclui ingresso ao parque)"}, {"titulo": "Laguna Parón — a maior laguna da cordilheira, com o Artesonraju (a montanha da Paramount) ao fundo", "duracao": "dia inteiro", "preco": "US$ 30–45 / S/ 110–170"}, {"titulo": "Glaciar Pastoruri + rota das Puyas Raimondi (bromélia gigante e rara)", "duracao": "dia inteiro", "preco": "US$ 29–45 / S/ 100–160"}, {"titulo": "Chavín de Huántar — sítio arqueológico pré-inca com galerias e túneis subterrâneos (menos óbvio)", "duracao": "dia inteiro", "preco": "US$ 25–45 / S/ 90–160 (ingresso ~S/ 15 à parte)"}, {"titulo": "Laguna Churup — trilha de aclimatação com trecho de escalada leve em corda", "duracao": "~6–7h (meio dia longo)", "preco": "tour ~S/ 60 ou por conta própria (colectivo + ingresso)"}], "dica": "Reserve 2 a 3 dias só para aclimatar antes de encarar Laguna 69 ou os treks longos: faça caminhadas mais baixas (Churup, Wilcacocha) primeiro. O mal de altitude é o que mais estraga viagem aqui — chegue hidratado, evite álcool nos primeiros dias e considere folhas de coca ou soroche pills."}, "Trujillo · Chan Chan": {"context": "Segunda maior cidade do Peru e capital da costa norte, Trujillo é apelidada de 'cidade da eterna primavera' pelo clima ameno o ano todo, com um centro histórico de casarões coloniais coloridos e sacadas de ferro forjado. A poucos quilômetros fica Chan Chan, a maior cidade de barro (adobe) do mundo, capital do reino Chimú e Patrimônio da Humanidade, além das pirâmides Moche das Huacas del Sol y de la Luna, com murais policromados impressionantes. O balneário vizinho de Huanchaco, com seus pescadores em caballitos de totora (barquinhos de junco milenares), completa o triângulo cultural e gastronômico da região.", "passeios": [{"titulo": "Chan Chan — Palácio Nik An (Tschudi) e museu de sítio", "duracao": "meio período (~3h)", "preco": "ingresso S/ 15 (vale 2 dias, inclui Huaca Esmeralda e Arco Iris); tour guiado S/ 40–60"}, {"titulo": "Huacas del Sol y de la Luna — pirâmides Moche com murais originais", "duracao": "meio período (~3h)", "preco": "ingresso S/ 10 + museu S/ 5; guia no local ~S/ 30"}, {"titulo": "Full day combinado: Huacas + Chan Chan + Huanchaco", "duracao": "dia inteiro", "preco": "S/ 120–160 por pessoa"}, {"titulo": "Huanchaco — pôr do sol, aula de surfe e ceviche à beira-mar", "duracao": "meio período / dia inteiro", "preco": "grátis (praia); aula de surfe ~S/ 50–70; passeio de caballito de totora ~S/ 15"}, {"titulo": "Complexo El Brujo e a múmia da Señora de Cao — a primeira governante conhecida do Peru antigo (menos óbvio)", "duracao": "dia inteiro (fica a ~60 km)", "preco": "US$ 50–80 / S/ 180–300 em tour privado ou compartilhado"}, {"titulo": "Caminhada pelo centro histórico — Plaza de Armas, Catedral e casonas coloniais", "duracao": "~2–3h", "preco": "grátis a pé; city tour guiado ~S/ 40"}], "dica": "O ingresso de Chan Chan é combinado e vale por dois dias para os três monumentos Chimú (Palácio Nik An, Huaca Arco Iris/Dragón e Huaca Esmeralda) — guarde o tíquete. Leve chapéu e água: não há sombra nas ruínas de barro e o sol da costa é forte mesmo em dias nublados."}, "Tambopata · Puerto Maldonado": {"context": "Puerto Maldonado é a porta de entrada para a Amazônia do sul do Peru, na região de Madre de Dios, e dá acesso à Reserva Nacional Tambopata, uma das áreas de maior biodiversidade do planeta. Mais quente, seca e acessível que Iquitos (chega-se por voo curto de Lima/Cusco ou pela estrada Interoceânica), é a escolha natural para quem combina a selva com uma passagem por Cusco. O grande atrativo são as colpas (barreiros de argila) onde centenas de araras e papagaios se reúnem ao amanhecer, além do Lago Sandoval, cercado de palmeiras aguaje e lar de ariranhas, jacarés e macacos.", "passeios": [{"titulo": "Lago Sandoval — remada silenciosa em busca de ariranhas, jacarés e macacos", "duracao": "full day ou 2 dias", "preco": "a partir de US$ 129 (full day); 2D1N ~US$ 180–250"}, {"titulo": "Colpa Chuncho / Colpa Colorado — a maior lambedeira de araras do mundo ao amanhecer", "duracao": "3 dias / 2 noites", "preco": "US$ 300–450"}, {"titulo": "Pacote Tambopata completo: colpa + Lago Sandoval + trilhas noturnas", "duracao": "4 dias / 3 noites", "preco": "US$ 430–580 (all inclusive com lodge)"}, {"titulo": "Isla de los Monos (Monkey Island) — santuário de macacos resgatados", "duracao": "meio período (geralmente incluso nos pacotes)", "preco": "~US$ 30–50 avulso"}, {"titulo": "Canopy walk / tirolesa e caminhada noturna atrás de jacarés e insetos gigantes", "duracao": "algumas horas (parte do lodge)", "preco": "incluso em pacotes de 3–4 dias"}, {"titulo": "Farm/chacra amazônica e cacau — provar chocolate direto do pé e frutas nativas (menos óbvio)", "duracao": "meio período", "preco": "~US$ 25–40 / S/ 90–150"}], "dica": "Para ver a colpa lotada de araras, vá na estação seca (maio a outubro) — na cheia (dez–mar) a atividade é imprevisível e a lambedeira pode ficar inacessível. Botas de borracha, repelente com DEET, lanterna e capa de chuva são essenciais; leve dinheiro em espécie porque quase não há caixa eletrônico dentro da reserva."}, "Iquitos": {"context": "Iquitos é a maior cidade do mundo sem acesso por estrada — só se chega de avião ou de barco pelo rio Amazonas — o que lhe dá uma aura de fim de mundo tropical. Enriquecida pelo boom da borracha no fim do século XIX, guarda mansões de azulejos portugueses e a Casa de Fierro atribuída a Eiffel, hoje desbotadas pelo calor úmido. É o portal para a Amazônia do norte do Peru e para a imensa Reserva Nacional Pacaya-Samiria, além do fascinante e caótico mercado flutuante de Belén, o 'Veneza amazônico' construído sobre palafitas.", "passeios": [{"titulo": "Mercado de Belén e a cidade flutuante — ervas, curiosidades amazônicas e vida ribeirinha", "duracao": "meio período (melhor de manhã)", "preco": "tour guiado S/ 30–60; passeio de canoa pelo bairro flutuante ~S/ 20–30"}, {"titulo": "Expedição à Reserva Pacaya-Samiria — botos cor-de-rosa, pesca de piranha e comunidades ribeirinhas", "duracao": "3 dias / 2 noites (ou mais)", "preco": "US$ 330–485 por pessoa"}, {"titulo": "Jungle lodge no rio Amazonas — caminhada noturna, avistamento de botos e nascer do sol na selva", "duracao": "3–4 dias", "preco": "US$ 300–500 (all inclusive)"}, {"titulo": "Isla de los Monos / centro de resgate de macacos e preguiças", "duracao": "meio período", "preco": "~S/ 80–120 (com transporte de barco)"}, {"titulo": "Lago Quistococha e serpentário — praia de água doce e fauna amazônica perto da cidade (menos óbvio)", "duracao": "meio período", "preco": "ingresso ~S/ 5–10; mototáxi ida e volta ~S/ 40"}, {"titulo": "Retiro de ayahuasca em centro xamânico — cerimônia guiada por curandeiro (para o lado espiritual)", "duracao": "de 1 noite a retiros de 7+ dias", "preco": "US$ 80–150 por cerimônia; retiros completos US$ 500–1.500+"}, {"titulo": "Caminhada pelo malecón Tarapacá e arquitetura do ciclo da borracha — Casa de Fierro e mansões de azulejo", "duracao": "~2h", "preco": "grátis a pé"}], "dica": "Calor e umidade são intensos o ano todo — leve repelente forte, roupa leve de secagem rápida e protetor solar. A época muda a experiência: na cheia (dez–maio) navega-se por igarapés que somem na seca (jun–nov), quando surgem praias de rio; escolha o lodge e o roteiro conforme o nível da água. Feche pacotes com agências de reputação verificada, evitando os agenciadores que abordam no aeroporto e na rua."}};
const ROUTES = [{"nome": "Clássico do Sul", "foco": "circuito completo do sul pela Ruta del Sol", "dias": 30, "sequencia": ["Lima", "Paracas", "Huacachina", "Nazca", "Arequipa", "Colca", "Puno", "Cusco", "Valle Sagrado", "Machu Picchu", "7 Colores", "Lima"], "porque": "A rota mais completa e sem estresse do sul, seguindo a Ruta del Sol de ônibus: deserto costeiro, Arequipa colonial, Lago Titicaca e Cusco. As paradas longas em Arequipa e Cusco (4-5 dias) são ideais pra intercalar dias de trabalho remoto antes de voltar por Lima."}, {"nome": "Sul + Amazônia", "foco": "cultura andina somada à selva de Tambopata", "dias": 30, "sequencia": ["Lima", "Paracas", "Huacachina", "Arequipa", "Colca", "Puno", "Cusco", "Valle Sagrado", "Machu Picchu", "Tambopata", "Lima"], "porque": "Combina o essencial andino com uma imersão de 3-4 dias num lodge na Amazônia, saindo de Cusco por ônibus noturno até Puerto Maldonado. Perfeita pra quem quer natureza e espiritualidade num roteiro só, fechando com voo de volta a Lima."}, {"nome": "Cordilheira & Trilhas", "foco": "trekking de altitude na Cordilheira Blanca", "dias": 30, "sequencia": ["Lima", "Huaraz", "Lima", "Paracas", "Huacachina", "Arequipa", "Colca", "Cusco", "Valle Sagrado", "Machu Picchu", "Humantay", "Lima"], "porque": "Pra quem prioriza natureza e trilhas: começa subindo de ônibus a Huaraz pra Laguna 69 e o trek Santa Cruz, depois desce pro sul clássico com Colca, Humantay e Machu Picchu. Bases de 4-5 dias dão tempo de aclimatar e trabalhar entre as caminhadas."}, {"nome": "Trio Essencial", "foco": "poucas bases fixas, imersão profunda e muito trabalho remoto", "dias": 30, "sequencia": ["Lima", "Paracas", "Arequipa", "Cusco", "Valle Sagrado", "Machu Picchu", "Humantay", "Lima"], "porque": "Menos deslocamentos e mais dias por cidade: Lima gastronômica, Arequipa e o eixo Cusco/Vale Sagrado/Machu Picchu com semanas inteiras em cada base. Ritmo tranquilo, ideal pra quem trabalha na estrada e quer conhecer o essencial sem correria."}];

/* ---------------- filtros ---------------- */
let active="all";
(function(){
  const host=document.getElementById('filters');
  const mk=(key,label,color)=>{
    const b=document.createElement('button');
    b.className='f'+(key==='all'?' on':'');b.textContent=label;b.dataset.k=key;
    if(color)b.style.setProperty('--tone',color);
    b.addEventListener('click',()=>setFilter(key));
    host.appendChild(b);return b;
  };
  mk('all','Tudo','#f0a95c');
  Object.entries(T).forEach(([k,v])=>mk(k,v.e+' '+v.l,v.c));
  mk('work','💻 Dá pra trabalhar','#5b8def');
})();
function match(p){
  if(active==='all')return true;
  if(active==='work')return !!p.work;
  return p.t===active;
}
function setFilter(k){
  active=k;
  document.querySelectorAll('.f').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hide',!match(P[+c.dataset.i])));
  P.forEach((p,i)=>{const m=MK[i];if(!m)return;
    const el=m.getElement&&m.getElement();if(el&&el.firstChild)el.firstChild.classList.toggle('dim',!match(p));});
  const lbl=k==='all'?'Todos os lugares':(k==='work'?'Bases pra trabalhar':T[k].l);
  document.getElementById('railtitle').textContent=lbl;
  count();
}
function count(){
  const n=P.filter(match).length;
  document.getElementById('railcount').textContent=n+(n===1?' lugar':' lugares');
}

/* ---------------- mapa ---------------- */
const MK={};let map=null;
function icon(color,big){
  return L.divIcon({className:'',html:`<div class="pin${big?' big':''}" style="background:${color}"></div>`,
    iconSize:big?[32,32]:[26,26],iconAnchor:big?[16,30]:[13,24]});
}
(function initMap(){
  try{
    const PERU=L.latLngBounds([[-18.9,-82.5],[0.4,-67.8]]);
    map=L.map('map',{zoomControl:true,scrollWheelZoom:true,maxBounds:PERU,maxBoundsViscosity:.85,minZoom:4});
    map.fitBounds([[-18.4,-81.4],[-0.1,-68.6]],{padding:[16,16]});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {attribution:'© OpenStreetMap © CARTO',maxZoom:17}).addTo(map);
    P.forEach((p,i)=>{
      const big=/Machu|Cusco|Lima/.test(p.n);
      const m=L.marker(p.c,{icon:icon(T[p.t].c,big),title:p.n}).addTo(map);
      m.on('click',()=>open(i));
      MK[i]=m;
    });
  }catch(e){
    document.getElementById('map').innerHTML=
      '<div class="mapfail">🗺️ O mapa precisa de internet pra carregar.<br>Os lugares estão logo abaixo — toque em qualquer um. 👇</div>';
    const n=document.getElementById('mapnote');if(n)n.style.display='none';
  }
})();

/* ---------------- carrossel ---------------- */
(function(){
  const rail=document.getElementById('rail');
  P.forEach((p,i)=>{
    const c=document.createElement('div');
    c.className='card';c.dataset.i=i;c.style.setProperty('--tone',T[p.t].c);
    c.innerHTML=`<div class="tone"></div><h3>${p.n}</h3>
      <div class="meta">${T[p.t].e} ${T[p.t].l} · ${p.d}</div>
      ${p.opt?'<span class="opt">se couber</span>':''}`;
    c.addEventListener('click',()=>open(i));
    rail.appendChild(c);
  });
  count();
})();

/* ---------------- rotas: sugeridas + a minha ---------------- */
const LS_MINE='peru_myroute_v1';
let routeLine=null, activeRoute=-1;
let myRoute=[]; try{myRoute=JSON.parse(localStorage.getItem(LS_MINE)||'[]').filter(i=>P[i]!=null);}catch(e){}
function coordOf(name){
  const p=P.find(p=>p.n===name)||P.find(p=>p.n.includes(name)||name.includes(p.n));
  return p?p.c:null;
}
function inSeq(seq,pn){return seq.some(s=>pn.includes(s)||s.includes(pn));}
function dimPin(k,dim){const m=MK[k];if(!m)return;const el=m.getElement&&m.getElement();if(el&&el.firstChild)el.firstChild.classList.toggle('dim',dim);}
function estDays(idxs){let s=0;idxs.forEach(i=>{const m=(P[i].d||'').match(/\d+/);if(m)s+=+m[0];});return s;}
function saveMine(){try{localStorage.setItem(LS_MINE,JSON.stringify(myRoute));}catch(e){}}
function inMine(i){return myRoute.indexOf(i)>=0;}
function updateMineChip(){const c=document.getElementById('mineChip');if(!c)return;const n=myRoute.length;c.querySelector('small').textContent=n?`${n} lugares · ~${estDays(myRoute)} dias`:'vazia — monte a sua';}
function setAddBtn(i){const ab=document.getElementById('addbtn');if(!ab)return;ab.dataset.i=i;if(inMine(i)){ab.classList.add('added');ab.textContent='✓ Na minha rota — remover';}else{ab.classList.remove('added');ab.textContent='➕ Adicionar à minha rota';}}
function toggleMineItem(i){const k=myRoute.indexOf(i);if(k>=0)myRoute.splice(k,1);else myRoute.push(i);saveMine();updateMineChip();const ab=document.getElementById('addbtn');if(ab&&+ab.dataset.i===i)setAddBtn(i);if(activeRoute==='mine')drawMine();}
(function(){
  const host=document.getElementById('rchips');if(!host)return;
  const mine=document.createElement('button');mine.className='rc mine';mine.id='mineChip';
  mine.innerHTML='⭐ Minha rota<small></small>';
  mine.addEventListener('click',toggleMine);
  host.appendChild(mine);
  ROUTES.forEach((r,i)=>{
    const b=document.createElement('button');b.className='rc';b.dataset.i=i;
    b.innerHTML=`${r.nome}<small>${r.dias} dias · ${r.foco}</small>`;
    b.addEventListener('click',()=>toggleRoute(i));
    host.appendChild(b);
  });
  updateMineChip();
})();
function toggleMine(){if(activeRoute==='mine'){clearRoute();return;}clearRoute();activeRoute='mine';drawMine();}
function drawMine(){
  if(routeLine&&map){try{map.removeLayer(routeLine);}catch(e){}routeLine=null;}
  const chip=document.getElementById('mineChip');if(chip)chip.classList.add('on');
  const det=document.getElementById('rdetail');det.className='rdetail show';
  if(!myRoute.length){det.innerHTML='<b>Minha rota</b> — ainda vazia. Abra qualquer lugar e toque em <b>“➕ Adicionar à minha rota”</b>. A ordem em que você adicionar vira a rota.';return;}
  const items=myRoute.map((idx,pos)=>`<span class="mi">${pos+1}. ${P[idx].n}<button data-rm="${idx}" aria-label="remover">✕</button></span>`).join('');
  det.innerHTML=`<b>Minha rota</b> · ${myRoute.length} lugares · ~${estDays(myRoute)} dias &nbsp;<button class="clr" id="clrMine">limpar</button><div class="milist">${items}</div>`;
  det.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>toggleMineItem(+b.dataset.rm)));
  const cm=document.getElementById('clrMine');if(cm)cm.addEventListener('click',()=>{myRoute=[];saveMine();updateMineChip();drawMine();});
  P.forEach((p,k)=>dimPin(k,myRoute.indexOf(k)<0));
  if(map){const pts=myRoute.map(i=>P[i].c).filter(Boolean);
    if(pts.length>1){routeLine=L.polyline(pts,{color:'#e8822e',weight:3.5,opacity:.95,dashArray:'2,9',lineCap:'round',lineJoin:'round'}).addTo(map);try{map.fitBounds(routeLine.getBounds(),{padding:[46,46]});}catch(e){}window.scrollTo({top:0,behavior:'smooth'});}
    else if(pts.length===1){map.setView(pts[0],7);window.scrollTo({top:0,behavior:'smooth'});}
  }
}
function clearRoute(){
  if(routeLine&&map){try{map.removeLayer(routeLine);}catch(e){}}
  routeLine=null;activeRoute=-1;
  document.querySelectorAll('.rc').forEach(c=>c.classList.remove('on'));
  const det=document.getElementById('rdetail');det.className='rdetail';det.innerHTML='';
  P.forEach((p,k)=>dimPin(k,false));
}
function toggleRoute(i){
  if(activeRoute===i){clearRoute();return;}
  clearRoute();activeRoute=i;
  const r=ROUTES[i];
  document.querySelector(`.rc[data-i="${i}"]`).classList.add('on');
  const det=document.getElementById('rdetail');
  det.className='rdetail show';
  det.innerHTML=`<b>${r.nome}</b> · ${r.dias} dias — ${r.porque}<br><span class="rseq">${r.sequencia.join(' → ')}</span>`;
  P.forEach((p,k)=>dimPin(k,!inSeq(r.sequencia,p.n)));
  if(map){
    const pts=r.sequencia.map(coordOf).filter(Boolean);
    if(pts.length>1){
      routeLine=L.polyline(pts,{color:'#4b7bec',weight:3.5,opacity:.9,dashArray:'2,9',lineCap:'round',lineJoin:'round'}).addTo(map);
      try{map.fitBounds(routeLine.getBounds(),{padding:[46,46]});}catch(e){}
      window.scrollTo({top:0,behavior:'smooth'});
    }
  }
}

/* ---------------- painel + fotos ---------------- */
const sheet=document.getElementById('sheet'),scrim=document.getElementById('scrim'),
      hero=document.getElementById('hero'),sbody=document.getElementById('sbody');
const CACHE={};

async function photo(titles){
  // Action API com origin=* = CORS liberado de verdade (mesmo método das fotos do site principal).
  // A REST API sem origin=* era bloqueada por CORS no navegador → foto sumia.
  for(const [idx,t] of titles.entries()){
    const lang=['pt','es','en'][idx]||'en';
    try{
      const u=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1`+
              `&prop=extracts%7Cpageimages&exintro=1&explaintext=1&exchars=340&piprop=thumbnail&pithumbsize=800`+
              `&titles=${encodeURIComponent(t)}`;
      const r=await fetch(u);
      if(!r.ok)continue;
      const j=await r.json();
      const pages=j.query&&j.query.pages;if(!pages)continue;
      const pg=Object.values(pages)[0];if(!pg)continue;
      const src=pg.thumbnail&&pg.thumbnail.source;
      if(!src||/\.svg/i.test(src))continue;            // pula escudos/bandeiras SVG
      return{img:src,extract:pg.extract||'',url:`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(t.replace(/ /g,'_'))}`};
    }catch(e){}
  }
  return null;
}

function open(i){
  const p=P[i],th=T[p.t];
  hero.innerHTML=`<div class="ph">${th.e}</div><div class="fade"></div>
    <div class="cap"><h2>${p.n}</h2><div class="sub">${p.d}${p.opt?' · opcional':''}</div></div>`;
  const list=(a)=>a.map(x=>`<li>${x}</li>`).join('');
  const ex=EX[p.n]||{};
  const pas=(ex.passeios||[]).map(x=>`<li><span class="pt">${x.titulo}</span><span class="pm">${x.duracao} · ${x.preco}</span></li>`).join('');
  sbody.innerHTML=`
    <div class="tags">
      <span class="tag k" style="background:${th.c}">${th.e} ${th.l}</span>
      ${p.work?'<span class="tag">💻 dá pra trabalhar</span>':''}
      ${p.opt?'<span class="tag">se couber</span>':''}
    </div>
    <button class="addbtn" id="addbtn" data-i="${i}"></button>
    <p class="why">${p.why}</p>
    ${ex.context?`<p class="ctx">${ex.context}</p>`:''}
    <div class="blk"><h4>O que ver</h4><ul>${list(p.see)}</ul></div>
    ${pas?`<div class="blk"><h4>Passeios &amp; preços</h4><ul class="pas">${pas}</ul></div>`:''}
    <div class="blk"><h4>Onde comer</h4><ul>${list(p.eat)}</ul></div>
    <div class="blk"><h4>Como chegar</h4><p>🚌 ${p.go}</p></div>
    ${ex.dica?`<div class="dica">💡 ${ex.dica}</div>`:''}
    <div class="blk" id="wkblk"></div>`;
  const ab=document.getElementById('addbtn');if(ab){ab.onclick=()=>toggleMineItem(i);setAddBtn(i);}
  sheet.classList.add('on');scrim.classList.add('on');sheet.setAttribute('aria-hidden','false');
  sheet.querySelector('.sheetscroll').scrollTop=0;
  if(map&&MK[i]){try{map.flyTo(p.c,/Machu|Humantay|Colores|Colca/.test(p.n)?8:6.6,{duration:.75});}catch(e){}}

  const done=(d)=>{
    if(!d)return;
    const im=document.createElement('img');im.alt=p.n;
    im.addEventListener('load',()=>im.classList.add('on'));   // listener ANTES do src
    im.addEventListener('error',()=>im.remove());
    hero.insertBefore(im,hero.firstChild);
    im.src=d.img;
    if(im.complete&&im.naturalWidth>0)im.classList.add('on'); // caso já esteja em cache
    const b=document.getElementById('wkblk');
    if(b&&d.extract)b.innerHTML=`<h4>Sobre</h4><p>${d.extract}</p>`+
      (d.url?`<a class="wk" href="${d.url}" target="_blank" rel="noopener">Ler na Wikipédia ↗</a>`:'');
  };
  if(CACHE[i]!==undefined){done(CACHE[i]);}
  else{photo(p.wiki).then(d=>{CACHE[i]=d;if(sheet.classList.contains('on'))done(d);});}
}
function close(){
  sheet.classList.remove('on');scrim.classList.remove('on');sheet.setAttribute('aria-hidden','true');
}
scrim.addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
/* arrastar pra baixo fecha (mobile) */
(function(){
  let y0=null;
  sheet.addEventListener('touchstart',e=>{if(sheet.querySelector('.sheetscroll').scrollTop<=0)y0=e.touches[0].clientY;},{passive:true});
  sheet.addEventListener('touchmove',e=>{
    if(y0===null)return;const dy=e.touches[0].clientY-y0;
    if(dy>0)sheet.style.transform=`translateY(${dy}px)`;
  },{passive:true});
  sheet.addEventListener('touchend',e=>{
    if(y0===null)return;
    const dy=(e.changedTouches[0].clientY-y0);
    sheet.style.transform='';
    if(dy>110)close();
    y0=null;
  },{passive:true});
})();
</script>
