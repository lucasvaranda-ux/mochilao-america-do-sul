name: Diagnóstico temporário · cartazes da Wikipedia
on:
  push:
    branches: ['claude/personal-life-page-planning-8a54fw']
    paths: ['.github/workflows/diag-cartazes.yml']
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir cartazes como um navegador vindo do site
        run: |
          IOS='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1'
          for u in \
            https://upload.wikimedia.org/wikipedia/pt/3/36/O_Sal_da_Terra.jpg \
            https://upload.wikimedia.org/wikipedia/commons/thumb/e/e8/Andor.svg/500px-Andor.svg.png \
            https://upload.wikimedia.org/wikipedia/pt/3/3b/A_Viagem_de_Chihiro.JPG \
            https://upload.wikimedia.org/wikipedia/en/d/d1/My_Brilliant_Friend_title_card.png \
            https://upload.wikimedia.org/wikipedia/en/4/4e/Thetreeoflifeposter.jpg \
            https://upload.wikimedia.org/wikipedia/commons/thumb/4/4b/House_of_the_dragon_logo.png/500px-House_of_the_dragon_logo.png ; do
            echo "=== $u"
            echo -n "sem referer, UA curl: "; curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" "$u"
            echo -n "iPhone + referer do site: "; curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" -A "$IOS" -e "https://mochilao.madeinbr.app/" -H "Accept: image/webp,image/avif,image/*,*/*;q=0.8" -H "Sec-Fetch-Dest: image" -H "Sec-Fetch-Mode: no-cors" -H "Sec-Fetch-Site: cross-site" "$u"
            echo -n "iPhone sem referer: "; curl -s -o /dev/null -w "%{http_code} %{content_type} %{size_download}\n" -A "$IOS" "$u"
          done
          echo "=== cabeçalhos da resposta (iPhone + referer)"
          curl -s -D - -o /dev/null -A "$IOS" -e "https://mochilao.madeinbr.app/" https://upload.wikimedia.org/wikipedia/pt/3/36/O_Sal_da_Terra.jpg | head -30
          echo "=== corpo se não for imagem"
          curl -s -A "$IOS" -e "https://mochilao.madeinbr.app/" https://upload.wikimedia.org/wikipedia/pt/3/36/O_Sal_da_Terra.jpg | head -c 600; echo
