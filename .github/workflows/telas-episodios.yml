name: Telas · episódios e onde assistir

on:
  schedule:
    - cron: '17 10 * * *'   # 07h17 em Brasília, todo dia
  workflow_dispatch:
    inputs:
      somente_posteres:
        description: 'Só os pôsteres (sem buscar episódios nem mandar e-mail)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'telas/acompanhando.json'
      - 'telas/dados.json'
      - 'scripts/telas-episodios.mjs'
      - 'scripts/telas-streaming.mjs'
      - 'scripts/telas-posteres.mjs'
      - 'scripts/telas-ids.mjs'
      - 'scripts/telas-sagas.mjs'
      - 'scripts/telas-notas.mjs'
      - 'scripts/telas-omdb.mjs'
      - 'telas/catalogo.json'

permissions:
  contents: write

concurrency:
  group: telas-episodios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar episódios, gerar calendário e avisar
        if: ${{ !inputs.somente_posteres }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/telas-episodios.mjs
      - name: Onde assistir no Brasil (JustWatch via TMDB)
        id: streaming
        if: ${{ !inputs.somente_posteres }}
        # se o TMDB falhar ou travar, os episódios do dia ainda são salvos;
        # o último passo deixa a execução vermelha para o GitHub avisar por e-mail
        continue-on-error: true
        timeout-minutes: 8
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/telas-streaming.mjs
      - name: IDs do IMDb e do TMDB para o que não tem (catálogo e dados.json)
        id: ids
        # roda também no "Só os pôsteres": é o IMDb ID que dá cartaz e onde assistir aos títulos do catálogo.
        # Só aceita casamento seguro (título igual e ano ±1); as dúvidas vão para telas/ids-pendentes.json.
        # Sem o segredo TMDB_API_KEY, não faz nada. Se falhar, o resto do dia segue.
        continue-on-error: true
        timeout-minutes: 8
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/telas-ids.mjs
      - name: Sagas completas pelas coleções do TMDB (o filme que faltava entra no catálogo)
        id: sagas
        # roda também no "Só os pôsteres", antes deles: os filmes novos já ganham cartaz na mesma execução.
        # Sem o segredo TMDB_API_KEY, não faz nada. Se falhar, o resto do dia segue.
        continue-on-error: true
        timeout-minutes: 8
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/telas-sagas.mjs
      - name: Notas do IMDb de todo o catálogo (base pública do IMDb)
        id: notas
        # nota e votos do IMDb para todo título com imdb_id (telas/notas.json); só regrava quando muda
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/telas-notas.mjs
      - name: Notas do Rotten Tomatoes e do Metacritic (OMDb)
        id: omdb
        # até 800 títulos por dia (a chave grátis dá 1.000), os nunca consultados primeiro, depois os de mais de 45 dias;
        # grava telas/notas-fora.json. Sem o segredo OMDB_API_KEY, não faz nada. Se falhar, o resto do dia segue.
        continue-on-error: true
        timeout-minutes: 7
        env:
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: node scripts/telas-omdb.mjs
      - name: Pôsteres (TMDB; Wikipedia via Wikidata para o que faltar)
        id: posteres
        # mesma regra do onde assistir: se o TMDB e a Wikimedia falharem, o resto do dia ainda é
        # salvo e o último passo deixa a execução vermelha. Sem o segredo, só a Wikipedia.
        continue-on-error: true
        timeout-minutes: 7
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        # cwebp (pacote webp) reduz as cópias locais dos cartazes para 360 px em WebP; sem ele, vão como vieram
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq webp) >/dev/null 2>&1 || echo "sem cwebp: cópias no formato original"
          node scripts/telas-posteres.mjs
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain telas/)" ]; then
            git config user.name "telas-robo"
            git config user.email "telas-robo@users.noreply.github.com"
            git add telas/episodios.json telas/lancamentos.ics
            if [ -f telas/streaming.json ]; then git add telas/streaming.json; fi
            if [ -f telas/posteres.json ]; then git add telas/posteres.json; fi
            if [ -d telas/cartazes ]; then git add -A telas/cartazes; fi
            git add telas/catalogo.json telas/dados.json
            if [ -f telas/ids-pendentes.json ]; then git add telas/ids-pendentes.json; fi
            if [ -f telas/sagas-tmdb.json ]; then git add telas/sagas-tmdb.json; fi
            if [ -f telas/notas.json ]; then git add telas/notas.json; fi
            if [ -f telas/notas-fora.json ]; then git add telas/notas-fora.json; fi
            git commit -m "telas: robô atualizou episódios, onde assistir, IDs e pôsteres"
            git push
          else
            echo "sem mudanças"
          fi
      - name: Avisar se o onde assistir falhou
        if: steps.streaming.outcome == 'failure'
        run: |
          echo "::error::Onde assistir não foi atualizado — veja o passo do TMDB (chave TMDB_API_KEY ou TMDB fora do ar)"
          exit 1
      - name: Avisar se os IDs falharam
        if: ${{ !cancelled() && steps.ids.outcome == 'failure' }}
        run: |
          echo "::error::IDs do IMDb não foram procurados — veja o passo dos IDs (chave TMDB_API_KEY ou TMDB fora do ar)"
          exit 1
      - name: Avisar se as notas da OMDb falharam
        if: ${{ !cancelled() && steps.omdb.outcome == 'failure' }}
        run: |
          echo "::error::Notas do Rotten e do Metacritic não foram atualizadas — veja o passo da OMDb (chave OMDB_API_KEY recusada ou OMDb fora do ar)"
          exit 1
      - name: Avisar se os pôsteres falharam
        if: ${{ !cancelled() && steps.posteres.outcome == 'failure' }}
        run: |
          echo "::error::Pôsteres não foram atualizados — veja o passo dos pôsteres (TMDB ou Wikipedia/Wikidata fora do ar, ou resposta mudou)"
          exit 1
