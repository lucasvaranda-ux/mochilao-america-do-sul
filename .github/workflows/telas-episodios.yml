name: Telas · episódios

on:
  schedule:
    - cron: '17 10 * * *'   # 07h17 em Brasília, todo dia
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telas/acompanhando.json'
      - 'telas/dados.json'
      - 'scripts/telas-episodios.mjs'

permissions:
  contents: write

concurrency:
  group: telas-episodios
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Buscar episódios, gerar calendário e avisar
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/telas-episodios.mjs
      - name: Salvar se mudou
        run: |
          if [ -n "$(git status --porcelain telas/)" ]; then
            git config user.name "telas-robo"
            git config user.email "telas-robo@users.noreply.github.com"
            git add telas/episodios.json telas/lancamentos.ics
            git commit -m "telas: episódios atualizados"
            git push
          else
            echo "sem mudanças"
          fi
